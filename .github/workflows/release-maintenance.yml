name: Maintain release pins

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: immutable-release-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUTO_PROMOTE_ENABLED: ${{ vars.AUTO_PROMOTE_ENABLED }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify update tooling
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/maintain.sh

      - name: Propose, qualify, and optionally promote release pins
        run: bash scripts/maintain.sh
